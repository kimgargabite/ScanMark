
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScanMark</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scanmark-container">

        <div class="sparkle sparkle-one">✦</div>
        <div class="sparkle sparkle-two">✧</div>

        <div class="logo">
            SCAN<span>MARK</span>
        </div>

        <p class="tagline">
            Scan. Read. Get Inspired.
        </p>

        <div class="quote-card">

            <div class="quote-icon">
                “
            </div>

            <p class="label">
                YOUR SCANMARK QUOTE
            </p>

            <p id="quote">
                Keep going. Your effort matters.
            </p>

            <p id="category" class="category">
                ✨ Motivation
            </p>

        </div>

        <button onclick="newQuote()">
            ✨ Get Another Quote
        </button>

        <p class="footer-text">
            A little reminder for your reading journey. 📖
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
