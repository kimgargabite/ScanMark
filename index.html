<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScanMark</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scanmark-container">

        <!-- Decorative Sparkles -->
        <div class="sparkle sparkle-one">✦</div>
        <div class="sparkle sparkle-two">✧</div>


        <!-- Logo -->
        <div class="logo">
            SCAN<span>MARK</span>
        </div>


        <!-- Tagline -->
        <p class="tagline">
            Scan. Read. Get Inspired.
        </p>


        <!-- Quote Card -->
        <div class="quote-card">

            <div class="quote-icon">
                “
            </div>

            <p class="label">
                YOUR SCANMARK QUOTE
            </p>

            <p id="quote">
                Keep going. Your effort matters.
            </p>

            <p id="category" class="category">
                ✨ Motivation
            </p>

        </div>


        <!-- New Quote Button -->
        <button type="button" onclick="newQuote()">
            ✨ Get Another Quote
        </button>


        <!-- Footer -->
        <p class="footer-text">
            A little reminder for your reading journey. 📖
        </p>

    </main>


    <!-- JavaScript -->
    <script src="script.js?v=2"></script>

</body>

</html>
